<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecHeur Agent</title>
<style>
:root{--bg:#f7f6f2;--surface:#fffefa;--border:#dedbd2;--text:#181714;--muted:#67635a;--accent:#0f766e;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#151512;--surface:#1b1b17;--border:#34332c;--text:#f1efe7;--muted:#b4aea1;--accent:#5eead4}}
html,body{height:100%;margin:0;display:flex;align-items:center;justify-content:center;font-family:var(--font);background:linear-gradient(180deg,rgba(255,255,255,.58),rgba(255,255,255,0) 220px),var(--bg);color:var(--text)}
.card{min-width:220px;padding:24px 28px;text-align:center;border:1px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:0 1px 2px rgba(32,27,18,.05),0 8px 24px rgba(32,27,18,.06);color:var(--muted)}.spinner{width:28px;height:28px;margin:0 auto 14px;border:3px solid color-mix(in srgb,var(--border) 76%,transparent);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body><div class="card"><div class="spinner"></div><div>Starting SecHeur Agent…</div></div></body>
</html>
